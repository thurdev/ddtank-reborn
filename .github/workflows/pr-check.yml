name: pr-check

on:
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Modelo revisor: aponta riscos, nunca aprova sozinho.
  # Configura secret AI_REVIEW_TOKEN quando for ligar (roadmap).
  ai-review:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff stat (sempre roda, sem segredo)
        run: git diff --stat origin/${{ github.base_ref }}...HEAD
      - name: Placeholder review IA
        run: echo "AI review pendente de secret AI_REVIEW_TOKEN (ver docs/BRANCH-FLOW.md)"

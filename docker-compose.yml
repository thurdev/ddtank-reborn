name: ddtank

x-vendor-mounts: &vendor-mounts
  - ./vendor/_assets/merged:/repo/vendor/_assets/merged:ro
  - ./vendor/DDTank41/Source Flash/FlashSV1:/repo/vendor/DDTank41/Source Flash/FlashSV1:ro
  - ./apps/client-harness/public/ruffle:/repo/apps/client-harness/public/ruffle:ro

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_USER: ${POSTGRES_USER:-ddtank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (scripts/gen-secrets.mjs)}
      POSTGRES_DB: ${POSTGRES_DB:-ddtank}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ddtank} -d ${POSTGRES_DB:-ddtank}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: apps/api/.env
    environment:
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - *vendor-mounts
      - uploads_data:/repo/apps/api/.data/uploads
    expose: ["8080"]

  game:
    build:
      context: .
      dockerfile: apps/game/Dockerfile
    restart: unless-stopped
    env_file: apps/game/.env
    environment:
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9200:9200"   # Flash projector TCP (ServerList.ashx advertises GAME_PORT-69; keep GAME_PORT=9200)
      - "843:843"     # Flash socket policy file
    expose: ["9300"]  # WebSocket; only reached through Caddy's /ws proxy, never published directly

  caddy:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on: [api, game]
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"   # admin, IP-only/no-domain mode (ignored once ADMIN_ADDRESS is a real hostname on 443)
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  # One-shot asset-regeneration job (docs/BACKLOG.md [deploy] note). Not started by `docker compose up`;
  # run explicitly after populating ./vendor (see docs/deploy/README.md):
  #   docker compose --profile assets run --rm assets
  assets:
    profile: ["assets"]
    build:
      context: .
      dockerfile: docker/assets/Dockerfile
    volumes:
      - ./vendor/_assets/merged:/repo/vendor/_assets/merged:ro
      - uploads_data:/repo/apps/api/.data/uploads

volumes:
  pg_data:
  uploads_data:
  caddy_data:
  caddy_config:
